<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Net worth — Balance sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700;12..96,800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:"Bricolage Grotesque",system-ui,sans-serif;color:#17181C;background:#F1EFEA}
a{color:#2B47B8}a:hover{color:#1C2F80}
.hatch{background-image:repeating-linear-gradient(135deg,#17181C 0 1.5px,transparent 1.5px 7px)}
</style>
</head>
<body>
<div style="width: 560px; height: 420px; box-sizing: border-box; padding: 32px; background: #F1EFEA; color: #17181C; display: flex; flex-direction: column; gap: 22px; font-variant-numeric: tabular-nums">
<div style="display: flex; justify-content: space-between; align-items: flex-end">
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 15px; font-weight: 500; color: #55565C">Net worth</span>
<span style="font-size: 76px; font-weight: 800; letter-spacing: -0.045em; line-height: 0.9">$284,650</span>
</div>
<div style="display: flex; flex-direction: column; align-items: flex-end; gap: 6px; padding-bottom: 4px">
<span style="font-size: 15px; font-weight: 700; padding: 6px 12px; border-radius: 999px; background: #17181C; color: #F1EFEA">+15.5%</span>
<span style="font-size: 13px; color: #55565C">+$38,210 this year</span>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; font-size: 13px; font-weight: 500"><span>You own</span><span>$412,300</span></div>
<div style="display: flex; gap: 3px; height: 52px">
<div style="flex-grow: 145000; flex-basis: 0; background: #1C2F80; border-radius: 10px 4px 4px 10px"></div>
<div style="flex-grow: 142750; flex-basis: 0; background: #3552C9; border-radius: 4px"></div>
<div style="flex-grow: 96150; flex-basis: 0; background: #7390EB; border-radius: 4px"></div>
<div style="flex-grow: 28400; flex-basis: 0; background: #B9C8F6; border-radius: 4px 10px 10px 4px"></div>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; font-size: 13px; font-weight: 500"><span>You owe $127,650</span><span>What's left is yours</span></div>
<div style="display: flex; gap: 3px; height: 52px">
<div style="flex-grow: 118200; flex-basis: 0; background: #D3551F; border-radius: 10px 4px 4px 10px"></div>
<div style="flex-grow: 7650; flex-basis: 0; background: #EE9360; border-radius: 3px"></div>
<div style="flex-grow: 1800; flex-basis: 0; background: #F6C3A3; border-radius: 2px"></div>
<div class="hatch" style="flex-grow: 284650; flex-basis: 0; border: 1.5px solid #17181C; box-sizing: border-box; border-radius: 4px 10px 10px 4px; display: flex; align-items: center; justify-content: flex-end; padding: 0 12px">
<span style="background: #F1EFEA; padding: 3px 8px; border-radius: 6px; font-size: 13px; font-weight: 700">Net worth</span>
</div>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); row-gap: 10px; column-gap: 12px; font-size: 12px; margin-top: 2px">
<div style="display: flex; gap: 7px; align-items: center"><span style="width: 10px; height: 10px; border-radius: 3px; background: #1C2F80"></span><span>Property <b>145K</b></span></div>
<div style="display: flex; gap: 7px; align-items: center"><span style="width: 10px; height: 10px; border-radius: 3px; background: #3552C9"></span><span>Invest. <b>142.8K</b></span></div>
<div style="display: flex; gap: 7px; align-items: center"><span style="width: 10px; height: 10px; border-radius: 3px; background: #7390EB"></span><span>Retire. <b>96.2K</b></span></div>
<div style="display: flex; gap: 7px; align-items: center"><span style="width: 10px; height: 10px; border-radius: 3px; background: #B9C8F6"></span><span>Cash <b>28.4K</b></span></div>
<div style="display: flex; gap: 7px; align-items: center"><span style="width: 10px; height: 10px; border-radius: 3px; background: #D3551F"></span><span>Mortgage <b>118.2K</b></span></div>
<div style="display: flex; gap: 7px; align-items: center"><span style="width: 10px; height: 10px; border-radius: 3px; background: #EE9360"></span><span>Student <b>7.7K</b></span></div>
<div style="display: flex; gap: 7px; align-items: center"><span style="width: 10px; height: 10px; border-radius: 3px; background: #F6C3A3"></span><span>Cards <b>1.8K</b></span></div>
<div style="display: flex; gap: 7px; align-items: center"><span class="hatch" style="width: 10px; height: 10px; border-radius: 3px; border: 1px solid #17181C; box-sizing: border-box"></span><span>Net <b>284.7K</b></span></div>
</div>
</div>
</body>
</html>
