<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Net worth — Ring</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&amp;family=Manrope:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Manrope,system-ui,sans-serif;color:#10291F;background:#DCEADF}
a{color:#10291F}a:hover{color:#1F4A38}
</style>
</head>
<body>
<div style="width: 360px; height: 400px; box-sizing: border-box; padding: 24px; background: #DCEADF; color: #10291F; display: flex; flex-direction: column; align-items: center; gap: 16px; font-variant-numeric: tabular-nums">
<div style="align-self: stretch; display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: 700">
<span>Net worth</span>
<span style="font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 999px; background: #10291F; color: #DCEADF">+15.5% yr</span>
</div>
<div style="position: relative; width: 208px; height: 208px">
<svg width="208" height="208" viewBox="0 0 208 208" role="img" aria-label="Net worth is 69% of assets; liabilities are 31%" style="display: block">
<g transform="rotate(-90 104 104)">
<circle cx="104" cy="104" r="88" fill="none" stroke="#10291F" stroke-width="20" stroke-dasharray="376.7 552.9"></circle>
<circle cx="104" cy="104" r="88" fill="none" stroke="#10291F" stroke-opacity="0.22" stroke-width="20" stroke-dasharray="166.2 552.9" stroke-dashoffset="-381.7"></circle>
</g>
</svg>
<div style="position: absolute; top: 0; left: 0; width: 208px; height: 208px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px">
<span style="font-family: Unbounded, system-ui, sans-serif; font-size: 34px; font-weight: 700; letter-spacing: -0.03em; line-height: 1">$284.6K</span>
<span style="font-size: 12px; font-weight: 600; color: #2E4A3E">69% of what you own</span>
</div>
</div>
<div style="align-self: stretch; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: auto">
<div style="display: flex; flex-direction: column; gap: 4px; padding: 12px 14px; border-radius: 16px; background: #FFFFFF; background: rgba(255,255,255,0.55)">
<div style="display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: #2E4A3E"><span style="width: 8px; height: 8px; border-radius: 50%; background: #10291F"></span>Own</div>
<span style="font-family: Unbounded, system-ui, sans-serif; font-size: 17px; font-weight: 500">$412.3K</span>
</div>
<div style="display: flex; flex-direction: column; gap: 4px; padding: 12px 14px; border-radius: 16px; background: rgba(255,255,255,0.55)">
<div style="display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: #2E4A3E"><span style="width: 8px; height: 8px; border-radius: 50%; background: #10291F; opacity: 0.3"></span>Owe</div>
<span style="font-family: Unbounded, system-ui, sans-serif; font-size: 17px; font-weight: 500">$127.7K</span>
</div>
</div>
</div>
</body>
</html>
